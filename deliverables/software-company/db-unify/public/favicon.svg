<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- DBeaver 风格数据库图标：三层堆叠柱体 -->
  <!-- 底层 -->
  <rect x="5" y="20" width="22" height="8" rx="3" fill="#2DA0D0" />
  <rect x="5" y="19" width="22" height="3" rx="1.5" fill="#4DB8E6" />
  <!-- 中层 -->
  <rect x="6" y="12" width="20" height="8" rx="3" fill="#3CA8D8" />
  <rect x="6" y="11" width="20" height="3" rx="1.5" fill="#5CC2F0" />
  <!-- 顶层 -->
  <rect x="7" y="4" width="18" height="8" rx="3" fill="#4DB8E6" />
  <rect x="7" y="3" width="18" height="3" rx="1.5" fill="#6CC8F0" />
  <!-- 高光 -->
  <rect x="8" y="5" width="3" height="2" rx="1" fill="rgba(255,255,255,0.4)" />
  <rect x="8" y="13" width="3" height="2" rx="1" fill="rgba(255,255,255,0.35)" />
  <rect x="8" y="21" width="3" height="2" rx="1" fill="rgba(255,255,255,0.3)" />
</svg>
