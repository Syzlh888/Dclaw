# DClaw Docker Compose 部署 (v1.4.0-alpha.1: PG16 + 国密加密连接配置)
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dclaw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dclaw
      POSTGRES_USER: dclaw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # 仅初始化数据库时使用
    volumes:
      - dclaw-pg-data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - '127.0.0.1:5433:5432'  # 宿主 5433 → 容器 5432（避开 honcho 占用）
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dclaw']
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    container_name: dclaw-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      GM_MASTER_KEY: ${GM_MASTER_KEY}          # 国密主密钥，必须从外部注入
      GM_JWT_SECRET: ${GM_JWT_SECRET}
      GM_PWD_PEPPER: ${GM_PWD_PEPPER}
      DB_CONFIG_PATH: /app/config/db.enc       # 加密后的连接配置
      PORT: 3001
    volumes:
      - ./config:/app/config:ro                # 只读挂载，包含 db.enc
      - ./backups:/backups
    ports:
      - '8080:3001'   # 外部 8080 → 容器内 3001（医院内网 80 常受限）

volumes:
  dclaw-pg-data:
    name: dclaw-pg-data
