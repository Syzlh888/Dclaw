# DClaw Docker Compose 部署 (v1.4.0-alpha.1: PG16 + 国密加密连接配置)
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dclaw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dclaw
      POSTGRES_USER: dclaw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # 仅初始化数据库时使用
    volumes:
      - dclaw-pg-data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - '127.0.0.1:5433:5432'  # 宿主 5433 → 容器 5432（避开 honcho 占用）
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dclaw']
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: db-unify-web:stable-v1.4.0
    container_name: dclaw-web
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      GM_MASTER_KEY: ${GM_MASTER_KEY}
      GM_JWT_SECRET: ${GM_JWT_SECRET}
      GM_PWD_PEPPER: ${GM_PWD_PEPPER}
      ENCRYPTION_KEY: 5be9c0634982469f5b414d2979193f14dda7bbde61f3d4c9bf6fc8d8ef5a12fd
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: dclaw
      DB_PASSWORD: DClaw@2024Pwd
      DB_NAME: dclaw
      PORT: 3001
    volumes:
      - ./backups:/backups
    ports:
      - '8081:3001'

volumes:
  dclaw-pg-data:
    name: dclaw-pg-data
